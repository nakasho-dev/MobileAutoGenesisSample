name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  ios-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build
        working-directory: ios
        run: xcodebuild -scheme SampleApp -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15' build

  behave-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install behave
        run: pip install behave
      - name: Dry-run feature parse
        working-directory: behave-demo
        run: python -m behave --dry-run || true
